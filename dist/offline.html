<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runners World — Офлайн</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .card { text-align: center; max-width: 400px; }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #111827; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    button { background: #2563eb; color: white; border: none; padding: 12px 32px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Интернэт холболт алга</h1>
    <p>Та интернэт холболтоо шалгаад дахин оролдоно уу.</p>
    <button onclick="location.reload()">Дахин оролдох</button>
  </div>
</body>
</html>
